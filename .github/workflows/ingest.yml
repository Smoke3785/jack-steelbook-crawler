name: Ingest

on:
  # Daily crawl at 06:17 UTC (off the hour to spread API load).
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Build must not need TMDB; matching is optional at runtime.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Restore database
        uses: actions/cache@v4
        with:
          path: data/app.db
          key: sqlite-${{ github.run_id }}
          restore-keys: sqlite-

      - name: Run ingest
        run: npm run ingest:cron
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Show run stats
        run: |
          sqlite3 data/app.db "SELECT id, trigger, started_at, finished_at FROM ingest_runs ORDER BY id DESC LIMIT 3" || true
